<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- TITLE --></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">
  <style>
    :root {
      --r-heading-font: 'Noto Sans TC', sans-serif;
      --r-main-font: 'Noto Sans TC', sans-serif;
      --r-heading-color: #eee;
      --r-main-color: #ccc;
      --r-link-color: #6ab0f5;
    }
    .reveal h1 { font-size: 2em; }
    .reveal h2 { font-size: 1.5em; border-bottom: 1px solid #444; padding-bottom: 0.2em; }
    .reveal h3 { font-size: 1.1em; color: #aaa; }
    .reveal section { text-align: left; }
    .reveal section.center { text-align: center; }
    .reveal ul { margin-left: 1.2em; }
    .reveal li { margin: 0.35em 0; line-height: 1.55; }
    .reveal table { font-size: 0.85em; width: 100%; }
    .reveal table th { background: #2a2a2a; color: #ddd; }
    .reveal table td, .reveal table th { padding: 0.4em 0.8em; border: 1px solid #444; }
    .reveal table td { color: #ccc; }
    .reveal blockquote {
      background: #1e1e1e;
      border-left: 4px solid #555;
      margin: 0.8em 0;
      padding: 0.6em 1em;
      font-style: normal;
      font-size: 0.88em;
      color: #aaa;
      width: 100%;
      box-sizing: border-box;
    }
    .reveal pre code {
      font-size: 0.75em;
      line-height: 1.5;
    }
    .reveal .chapter-title {
      text-align: center;
      margin-top: 2em;
    }
    .reveal .chapter-title h1 {
      font-size: 3em;
      color: #555;
      margin-bottom: 0;
    }
    .reveal .chapter-title h2 {
      border: none;
      font-size: 1.6em;
      margin-top: 0.2em;
      color: #ddd;
    }
    .reveal ol { margin-left: 1.2em; }
    .reveal ol li { font-size: 0.88em; margin: 0.3em 0; line-height: 1.5; }
  </style>
</head>
<body>
<div class="reveal">
  <div class="slides">

    <!-- Cover -->
    <section class="center">
      <p style="color:#666; font-size:0.9em; margin-bottom:0.5em;">書名</p>
      <h1 style="font-size:3.5em; margin:0;">Chapter N</h1>
      <h2 style="border:none; margin-top:0.3em;">章節標題</h2>
    </section>

    <!-- 投影片內容放這裡 -->

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    transition: 'fade',
    transitionSpeed: 'fast',
    controls: true,
    progress: true,
    center: false,
    width: 960,
    height: 700,
    margin: 0.08,
  });
</script>
</body>
</html>
